<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The earlier GraphSentinel dashboard (CICIDS2017 file detection and, with VITE_SHOW_RESEARCH=true, the research views), kept unchanged." />
    <title>GraphSentinel, legacy dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      try { var t = localStorage.getItem("graphsentinel-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>The GraphSentinel dashboard needs JavaScript to load results from the API.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
